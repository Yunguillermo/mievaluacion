<!DOCTYPE html>
<html>
<head>
    <title>Evaluación A</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FFCC99;
            text-align: center;
            margin: 0;
        }
        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .top {
            width: 100%;
            background-color: #FFDAB9;
            padding: 20px;
        }
        .bottom {
            display: flex;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .frame {
            width: 45%;
            border: 2px solid #D2691E;
            height: 400px;
            margin: 10px;
            background-color: #FFF;
            padding: 10px;
            overflow: auto;
            text-align: left;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        form {
            background-color: #FFF2CC;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            width: 90%;
            max-width: 500px;
        }
        label {
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 5px;
            margin: 5px 0;
            border-radius: 5px;
        }
        button {
            background-color: #D2691E;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        @media (max-width: 800px) {
            .bottom {
                flex-direction: column;
                align-items: center;
            }
            .frame {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top">
            <h1>Evaluación A</h1>
            <p><strong>Guillermo Gutierrez Sorioco - Fila de valoración: A</strong></p>
            <img src="https://i.postimg.cc/sBFQjzrt/LAFOTO.jpg" alt="Foto de Guillermo" width="150">
            <div style="background-color:#D2691E; padding:10px; color:white;">
                <select>
                    <option>Inicio</option>
                    <option>Sobre mí</option>
                    <option>Proyectos</option>
                    <option>Contacto</option>
                </select>
            </div>
        </div>
        <div class="bottom">
            <div class="frame">
                <h2>Curso de HTML de Soy Dalto</h2>
                <iframe src="https://www.youtube.com/embed/ELSm-G201Ls" allowfullscreen></iframe>
            </div>
            <div class="frame">
                <h2>Formulario de Registro</h2>
                <form>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                    
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    
                    <label for="sexo">Sexo:</label>
                    <select id="sexo" name="sexo" required>
                        <option value="hombre">Hombre</option>
                        <option value="mujer">Mujer</option>
                    </select>

                    <label for="redes">¿Cómo nos conoció?</label>
                    <select id="redes" name="redes">
                        <option>Facebook</option>
                        <option>Instagram</option>
                        <option>Twitter</option>
                        <option>TikTok</option>
                        <option>Otro</option>
                    </select>

                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4"></textarea>

                    <button type="submit">Enviar</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
